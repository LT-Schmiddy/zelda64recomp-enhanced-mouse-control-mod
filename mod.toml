# Config file for an example Majora's Mask: Recompiled mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "mm_enhanced_mouse_controls"

# Version of this mod.
version = "1.0.0"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Enhanced Mouse Controls"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description =  """
This is an example mod for Majora's Mask: Recompiled that can be used as a template for creating mods. \
When this mod is enabled, you will always perform a quickspin when swinging your sword.

For more details, see https://github.com/Zelda64Recomp/MMRecompModTemplate."""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Always perform a quickspin when swinging your sword."

# Authors of this mod.
authors = [ "Your name here" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "1.2.0"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
# Example dependency:
#    "modname:1.0.0"
]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
# Example native library:
#    { name = "my_native_library", funcs = ["my_native_library_function"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "mm_enhanced_mouse_controls"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = [ ]


[[manifest.config_options]]
id = "first-person-bow-control"
name = "Fire the Bow with B"
description = """
The Bow can be optionally be fired with the R button, overriding shielding behavior.
Off - Feature Disabled
First Person - The Bow is only fired using B when in first person aiming.
Aiming - The Bow is only fired using B when it is being aimed, through first-person or lock-on. 
Holding - The Bow can be fired with B as long as it is being held. Put it away (or draw your sword) to resume sword behavior.
"""
type = "Enum"
options = ["Off", "First Person", "Aiming", "Holding"]
default = "Off"

[[manifest.config_options]]
id = "first-person-hookshot-control"
name = "Fire the Hookshot with B"
description = """
The Hookshot can be optionally be fired with the B button.
Off - Feature Disabled
First Person - The Hookshot is only fired using B when in first person aiming.
Aiming - The Hookshot is only fired using B when it is being aimed, through first-person or lock-on.
Holding - The Hookshot can be fired with B as long as it is being held. Put it away (or draw your sword) to resume sword behavior.
"""
type = "Enum"
options = ["Off", "First Person", "Aiming", "Holding"]
default = "Off"

[[manifest.config_options]]
id = "first-person-fire-button"
name = "First Person Bow Button"
description = """Something"""
type = "Enum"
options = [ "B", "M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8" ]
default = "B"